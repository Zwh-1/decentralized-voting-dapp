# The application's virtual hosts.
#
# ---------------------------------------------------------------------------
# Prerequisite: a certificate must exist, or nginx will not start
# ---------------------------------------------------------------------------
#
# nginx reads its certificate files at startup and refuses to run if they are
# missing. That makes "get a certificate" a hard prerequisite of the whole stack,
# not a later refinement -- so ops/nginx/README.md gives the exact command to
# generate a self-signed pair, which is what you use when you have no domain yet.
# A self-signed certificate is enough to bring the stack up and smoke-test it;
# it is not enough to put in front of users, because browsers will warn.
#
# server_name is `_` (catch-all) so this works on a bare IP as well as a domain.
# Replace it with the real hostname once one exists; nothing else needs to change.

# Plain HTTP exists only to redirect. Anything served here would be visible to
# the network, and the application sets a session-relevant cookie.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Let an ACME challenge through before the redirect, so certificate issuance
    # and renewal keep working. Without this, the redirect would also bounce the
    # CA's validation request and renewal would fail -- a failure that only shows
    # up months later, when the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # The metrics endpoint is refused, explicitly.
    #
    # Relying on "we do not publish that port" is not enough here: this proxy
    # forwards everything under / to the application, so /api/metrics would be
    # reachable from the internet by default. Metrics describe the deployment's
    # internals -- index position, error counts, chain id -- and there is no
    # reason for them to be public. Prometheus reads them over the internal
    # network directly, so refusing them here costs nothing.
    #
    # `location =` is an exact match, so it wins over the prefix location below
    # regardless of ordering.
    # ---------------------------------------------------------------------------
    location = /api/metrics {
        return 403;
    }

    # Rate-limited separately from the rest: these are the requests that touch
    # the database and the chain.
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://voting_app;
        proxy_http_version 1.1;
        # Required for the upstream `keepalive 32` to have any effect: without
        # clearing the inherited `Connection: close`, nginx closes each upstream
        # connection after one request.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The health endpoint reads the chain, so it is slower than a static
        # page. These are generous enough not to cut off a slow-but-working
        # response, and short enough that a hung request does not hold a worker.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /_next/static/ {
        proxy_pass http://voting_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Next.js fingerprints these filenames, so a given URL's content never
        # changes and it is safe to cache indefinitely. This is the single
        # biggest reason the app feels fast on a repeat visit.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://voting_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
