# SPDX-License-Identifier: MIT
#
# nginx front end. Terminates TLS and proxies to whichever slot is active.
#
# ---------------------------------------------------------------------------
# Why reload, and why it has to be graceful
# ---------------------------------------------------------------------------
#
# The dual-slot switch is performed by rewriting the upstream file and sending
# nginx a reload. Reload is what makes "zero downtime" a technical claim rather
# than a hopeful one: nginx starts new workers with the new configuration and
# then asks the old ones to shut down, and an old worker finishes the requests it
# has already accepted before it exits. Nothing in flight is dropped.
#
# `nginx -s stop` or a restart would not have that property, which is why the
# deploy script never uses them.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Container convention: log to stdout/stderr so `docker logs` and any log
    # collector see the same stream. A file inside the container would be lost
    # with the container.
    access_log  /dev/stdout  main;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time upstream=$upstream_response_time';

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Bounded so that a large body cannot be used to exhaust memory. The
    # application accepts no uploads, so this is generous rather than tight.
    client_max_body_size 1m;

    # Rate limiting for the API. The application is read-mostly and every request
    # touches the database or the chain, so a runaway client is a real way to take
    # the site down for everyone else.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # The upstream. This file is GENERATED -- see ops/nginx/README.md.
    #
    # The `active-slot` file under /srv/voting/state is the single source of
    # truth; this include is a derived artifact rendered from it by
    # render-upstream.sh. Editing it by hand works until the next deploy, which
    # silently overwrites it -- so an edit here is a change that appears to work
    # and then disappears.
    # ---------------------------------------------------------------------------
    include /etc/nginx/upstream/upstream.conf;

    include /etc/nginx/conf.d/*.conf;
}
