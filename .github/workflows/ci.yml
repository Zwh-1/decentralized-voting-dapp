name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Additive only: release.yml calls this workflow as its gate, so that "the
  # tests passed before we published" is a fact rather than a convention. The
  # three triggers above keep their existing meaning, and no job changed.
  workflow_call:

env:
  # Hardhat 3 requires Node >= 22.13.0; this project was developed and verified
  # on 24.x, which is what CI pins so a green run means something.
  NODE_VERSION: "24"

jobs:
  contracts:
    name: Contracts (build, test, coverage, gas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run build:contracts

      - name: Solidity and TypeScript tests
        run: pnpm run test:contracts

      - name: Coverage
        run: pnpm run coverage

      - name: Gas statistics
        run: pnpm run gas

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: contracts/coverage/html
          if-no-files-found: ignore

  abi-drift:
    name: Generated ABI is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate and compare
        # The committed ABI in web/src/lib/contracts is what the app compiles
        # against. Regenerating it and requiring a clean diff is what stops it
        # from silently going stale.
        run: |
          pnpm run build:contracts
          pnpm run export-abi
          git diff --exit-code -- web/src/lib/contracts

  web:
    name: Web (typecheck, tests, schema, build)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: voting
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Only DATABASE_URL is consumed here, by `indexer:migrate`. The other two
      # are kept so the schema step runs under the same environment the app uses
      # locally, but no step in this job talks to a chain.
      #
      # Boundary: this job does NOT exercise the indexer end to end. Nothing here
      # starts a node, seeds, drains or runs the consistency check — the unit
      # tests below cover the indexer's decision logic and decoding with fakes,
      # which is a deliberately narrower guarantee. The end-to-end claim is
      # covered by the separate `indexer-e2e` job, not by this one.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/voting
      RPC_URL: http://127.0.0.1:8545
      CHAIN_ID: "31337"
      CONFIRMATIONS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        # The indexer's decision logic and log decoding, tested with fakes and
        # no chain or database in play.
        run: pnpm run test:indexer

      - name: Apply the schema to a real MySQL
        # Proves the schema is valid MySQL 8.4 and that the migration is
        # genuinely idempotent by running it twice.
        run: |
          pnpm run indexer:migrate
          pnpm run indexer:migrate

      - name: The vote-derivation views, against a real MySQL
        # `current_votes` and `option_tally` are where "the last event wins"
        # actually lives, and a correlated `NOT EXISTS` is exactly the kind of SQL
        # that a mock would happily accept while the real engine rejects it or
        # answers differently. `test/derivation.test.ts` runs its rows through the
        # REAL views whenever `DATABASE_URL` is set, and skips the SQL leg when it
        # is not — so without this variable CI would only ever exercise the
        # TypeScript model of the views and never the views themselves.
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/voting
        run: pnpm run test:indexer

      - name: Build
        run: pnpm run build:web

  indexer-e2e:
    name: Indexer end to end (fresh chain, fresh database)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: voting
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/voting
      RPC_URL: http://127.0.0.1:8545
      CHAIN_ID: "31337"
      # No confirmation window here: the job compares the whole chain against
      # the whole index, so lag must not be excused.
      CONFIRMATIONS: "0"
      # Smaller than the chain on purpose. The default of 2000 is larger than the
      # 406-block seeded chain, so every drain would finish in a single chunk and
      # the chunk loop in `drain.ts` would never iterate — the boundary handling
      # between chunks was asserted only by unit tests over a fake chain. At 7 the
      # drain runs 58 rounds, so the loop and its boundaries are exercised for real.
      CHUNK_BLOCKS: "7"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply the schema
        run: pnpm run indexer:migrate

      - name: Start a local chain and wait until it answers
        run: |
          pnpm --filter @voting/contracts exec hardhat node > /tmp/hardhat-node.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -X POST -H 'Content-Type: application/json' \
                --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                http://127.0.0.1:8545 > /dev/null; then
              echo "chain ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "the chain never came up:"
          tail -40 /tmp/hardhat-node.log
          exit 1

      - name: Seed — deploys the factory and creates two polls
        # One command, and it is self-contained: `seed-local.ts` deploys its own
        # factory and creates both polls itself. Adding `deploy:local` before it
        # would leave a second, empty factory on the chain.
        #
        # It creates TWO polls on purpose (200 votes in one, 5 in the other), so
        # this job also proves the per-poll isolation the platform rests on: a
        # projection that mixed two polls' votes would double-count here.
        run: pnpm run seed:local

      - name: Index the chain
        run: pnpm run indexer:drain

      - name: The index must agree with the chain, for every poll
        # The project's headline claim. Until this job existed, nothing in CI
        # checked it — see the boundary note on the `web` job above.
        #
        # It now checks every poll the factory created rather than one fixed
        # contract, and exits non-zero if ANY of them diverges.
        run: pnpm run indexer:check-consistency

      - name: Replaying the whole chain must not double-count
        # M-6b. Resetting the cursor forces every event row through the
        # idempotent path again; the tally must not move.
        run: |
          mysql -h 127.0.0.1 -uroot -proot voting -e "UPDATE sync_cursor SET last_block = 0;"
          pnpm run indexer:drain
          pnpm run indexer:check-consistency

      - name: Chain log
        if: failure()
        run: tail -100 /tmp/hardhat-node.log

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

  # Shell scripts are not covered by `pnpm format:check` -- Prettier has no parser
  # for .sh, so it skips them silently rather than failing. That left the deploy
  # scripts unverified by anything but their own self-test, which cannot notice a
  # quoting bug it does not exercise. shellcheck is the missing check, and it runs
  # here because it was not available on the development machine when those
  # scripts were written.
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck --version
          # -x follows sourced files, so lib.sh is checked in the context of each
          # script that sources it rather than standing alone.
          shellcheck -x ops/deploy/*.sh ops/indexer/*.sh ops/alertmanager/*.sh

  # The provenance check for alert rules and dashboards. It answers a question
  # promtool does not: whether the series a rule or panel names is one that
  # anything actually exports. A rule built on a missing series never fires, and a
  # panel on one renders empty -- both look like "nothing is wrong".
  observability-config:
    name: Observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Every series has an owner
        run: python ops/prometheus/check-rules.py

      - name: Validate Prometheus configuration
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /p/prometheus.yml
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules /p/rules/voting.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm -v "$PWD/ops/alertmanager:/p:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /p/alertmanager.yml.tmpl

  # Repository-specific workflow invariants: no ssh-keyscan, no
  # pull_request_target, no mutable tag as a deploy input, and the deploy lock
  # shared between release and rollback. actionlint validates the schema and
  # cannot know about any of these -- each is valid YAML and a valid workflow, and
  # still wrong here.
  workflow-invariants:
    name: Workflow invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Check the invariants
        run: python ops/ci/check-workflows.py

      # Runs the checker against deliberately broken copies. A checker that
      # cannot fail is not evidence, so it is made to fail on purpose here.
      - name: Prove the checker can fail
        run: python ops/ci/selftest.py
