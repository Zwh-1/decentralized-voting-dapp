packages:
  - contracts
  - web

# pnpm 10+ blocks dependency lifecycle scripts by default. esbuild (a
# transitive dependency of the Hardhat toolchain and of tsx) needs its
# postinstall to run, otherwise `pnpm install` exits non-zero and CI fails.
# `sharp` is pulled in by Next.js for image optimisation.
allowBuilds:
  esbuild: true
  sharp: true
