# One command to bring up the whole dApp.
#
#   docker compose up -d              # database, migrations, indexer, web
#   docker compose up -d mysql        # the database alone, and this keeps working
#
# Build the image first, from the repository root:
#
#   docker build -f web/Dockerfile -t voting-web:dev .
#
# The schema is applied by the `migrate` service, and only there. There is
# deliberately no docker-entrypoint-initdb.d mount and no seed .sql file: the
# schema has exactly one owner, web/src/lib/db/schema.ts, which the application
# and the deploy scripts both go through. A second definition living in a mounted
# script is the failure this arrangement exists to prevent -- it would drift, and
# the drift would only show up as an indexer reading a column that is not there.
#
# Port 3307 on the host is used on purpose so this never collides with an existing
# local MySQL on 3306.

# ---------------------------------------------------------------------------
# Secrets that arrive through `env_file: .env` but belong to a service the
# application containers never talk to.
#
# `env_file:` hands every app container the whole file, so without this the web,
# migrate and indexer containers would each carry the database root password, the
# monitoring account's password, the Grafana admin password and the SMTP
# password -- four credentials with no use inside them.
#
# `environment:` takes precedence over `env_file:` key by key, so listing them
# here as empty strings is a real removal, not a second copy of the value. The
# services that DO need them (mysql, mysqld-exporter, grafana) read the same file
# and are unaffected; alertmanager needs its own set, see the anchor below.
#
# Keys only, no values: this must never become a place a credential is written.
# ---------------------------------------------------------------------------
x-app-env-scrub: &app-env-scrub
  MYSQL_ROOT_PASSWORD: ""
  MYSQLD_EXPORTER_PASSWORD: ""
  GRAFANA_ADMIN_PASSWORD: ""
  SMTP_PASSWORD: ""

# ---------------------------------------------------------------------------
# The same idea for Alertmanager, with a different set -- which is why it is a
# second anchor and not a reuse of the first.
#
# Alertmanager needs `env_file:` for exactly one thing: the five SMTP_* values
# its entrypoint substitutes into alertmanager.yml. Reading the whole file also
# handed it the database root password in the clear (verified against a rendered
# `docker compose config`: MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD,
# MYSQLD_EXPORTER_PASSWORD and GRAFANA_ADMIN_PASSWORD all arrived with real
# values). A container that only sends mail has no use for any of them.
#
# It must KEEP SMTP_PASSWORD -- that is the one credential it exists to use -- so
# it cannot use `*app-env-scrub` above. It also drops MYSQL_PASSWORD, which the
# app containers legitimately need to reach the database and this one does not.
# ---------------------------------------------------------------------------
x-alertmanager-env-scrub: &alertmanager-env-scrub
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_PASSWORD: ""
  MYSQLD_EXPORTER_PASSWORD: ""
  GRAFANA_ADMIN_PASSWORD: ""

services:
  mysql:
    image: mysql:8.4
    container_name: voting-mysql
    restart: unless-stopped
    environment:
      # Interpolated, not literal.
      #
      # These four were hardcoded until 2026-09-23, which silently reduced every
      # `MYSQL_*` line in /srv/voting/.env to decoration: the server initialised
      # the database as root/voting regardless of what the operator wrote, so a
      # DATABASE_URL carrying the password they *did* set failed to
      # authenticate, and the index reported itself unavailable with no hint
      # that the password had been ignored.
      #
      # The defaults are the development credentials and exist so that
      # `docker compose up -d` still works on a fresh clone with no .env.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voting}
      MYSQL_USER: ${MYSQL_USER:-voting}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voting}
    ports:
      # Bound to loopback, not to every interface. The documented way to reach it
      # is 127.0.0.1:3307, which this preserves exactly, while a database that is
      # not exposed to the network at all is the better default on a host that
      # has a public address.
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - voting-mysql-data:/var/lib/mysql
    healthcheck:
      # `$$` escapes compose interpolation, so the check reads the password from
      # the container's own environment. The previous `-proot` was correct only
      # for as long as the password above stayed literal, which it no longer is.
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  # Applies the schema, once, before anything that reads it starts.
  #
  # It runs the same image as the app because it uses the same schema module. The
  # scripts execute TypeScript directly, which is why the image carries that
  # source and tsx -- see the Dockerfile.
  migrate:
    image: ${WEB_IMAGE:-voting-web}:${WEB_IMAGE_TAG:-dev}
    command: ["node", "--import", "tsx", "web/scripts/migrate.ts"]
    working_dir: /app
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      # Optional so that `docker compose config` validates on a fresh clone, where
      # no .env exists yet. It is required to actually run anything: without it
      # the app reports its configuration as unreadable and the migration fails
      # loudly, which is the intended outcome.
      - path: .env
        required: false
    environment:
      <<: *app-env-scrub
      INDEXER_ENABLED: "false"
    networks:
      - backend

  # Advances the index, one bounded drain at a time.
  #
  # Its own service rather than the app's in-process loop: two processes draining
  # the same cursor would race, and the loop inside the server is a development
  # convenience that does not survive a restart.
  indexer:
    image: ${WEB_IMAGE:-voting-web}:${WEB_IMAGE_TAG:-dev}
    command: ["/app/ops/indexer/entrypoint.sh"]
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env-scrub
      # It is the worker; the server's own loop must stay off in this service.
      INDEXER_ENABLED: "false"
    networks:
      # backend to reach MySQL, egress to reach the chain. A container whose only
      # network is internal has no route out, so an indexer on `backend` alone
      # could not read a single block -- which is the whole thing it does.
      - backend
      - egress

  web:
    image: ${WEB_IMAGE:-voting-web}:${WEB_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env-scrub
      # Indexing belongs to the indexer service. Two drains on one cursor is a
      # race, and the loser's work is silently discarded.
      INDEXER_ENABLED: "false"
    networks:
      # egress carries the outbound RPC calls the server makes to answer
      # /api/health and to render a ballot.
      - backend
      - egress
    # No published port here on purpose. Locally the port comes from the
    # development override; in production it comes from nginx.
    #
    # The healthcheck is not repeated here because the image already defines one
    # against /api/health. Two definitions would be two owners of "is this
    # healthy", and they would disagree the first time one of them changed.

  # ---------------------------------------------------------------------------
  # Observability. Every service here is behind a profile, so the application
  # comes up without any of it and, more importantly, keeps running when the
  # whole stack is stopped. That is a property worth being able to demonstrate:
  # monitoring that the monitored system depends on is a way to turn a broken
  # dashboard into an outage.
  #
  #   docker compose --profile observability up -d
  #
  # Only the services whose readiness gates something else carry a healthcheck.
  # The exporters do not: Prometheus's own `up` series already reports whether
  # each one answered, and the ContainerDown rule alerts on it. A container
  # healthcheck on top of that would be a second owner of "is it alive", and the
  # two would disagree the first time one of them changed.
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days: long enough to compare this week against the last one, short
      # enough that the disk cost stays predictable on a small server.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      # The `blackbox-external` target, written by the deployment's own setup
      # step (ops/server/README.md). An empty file is a valid state -- "nothing
      # to probe from outside" -- and is what this ships as until then. It is
      # filled in by hand rather than generated because a probe of a hostname
      # that does not exist yet alerts forever, and an alert nobody can clear is
      # one people learn to ignore.
      - ./ops/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    networks:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    restart: unless-stopped
    # The stock entrypoint is replaced because the config has to be rendered from
    # a template: Alertmanager cannot read the SMTP password from the environment
    # on its own, and the alternative is that password in a committed file.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./ops/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./ops/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    env_file:
      - path: .env
        required: false
    environment:
      # Keeps the five SMTP_* values, drops everything else that came in through
      # the file above. See x-alertmanager-env-scrub for why it is not
      # `*app-env-scrub`.
      <<: *alertmanager-env-scrub
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    networks:
      - backend

  # Host-level metrics. Without these there is no answer to "is the disk filling"
  # -- the application's own metrics describe the application and nothing about
  # the machine it is standing on.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["observability"]
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Where publish-version.sh writes the deployed tag. node-exporter reads the
      # directory on every scrape, which is how a deploy becomes visible on the
      # same timeline as everything else.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /srv/voting/state/textfile:/var/lib/node_exporter/textfile:ro
    mem_limit: 128m
    networks:
      - backend

  # Per-container metrics. `privileged` is not decorative: reading cgroup
  # accounting requires it, and there is no narrower grant that works. Said
  # plainly rather than buried, because a container running with full privileges
  # on the host is something a reader should be told about, not discover.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    mem_limit: 256m
    networks:
      - backend

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      # The password comes from the environment, never from a config file and
      # never from a committed .my.cnf: one fewer place a credential can be read
      # out of the repository or out of an image layer.
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - backend

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./ops/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 128m
    networks:
      # `backend` is internal: no route off the host. The `blackbox-external` job
      # probes the PUBLIC URL -- that is the whole point of it, "can a user reach
      # this" as opposed to `blackbox-internal`'s "is the process serving" -- and
      # a target on the public internet is unreachable from a network with no
      # gateway. Without `egress` that probe can only ever fail, which is a
      # permanent critical alert rather than a signal.
      #
      # This is the only exporter on `egress`; the other three observe things
      # inside the network and have no reason to leave it.
      - backend
      - egress

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Reachable over an SSH tunnel only. Nothing here is published, so the
      # dashboards cannot be reached from the internet at all.
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    networks:
      - backend

networks:
  # No route out: the database is reachable only by the services on this network,
  # and MySQL itself cannot reach the internet.
  backend:
    internal: true
  # Outbound access and ingress. The indexer and the server both call an RPC
  # endpoint, and the server is what nginx will talk to.
  egress:

volumes:
  voting-mysql-data:
  prometheus-data:
  grafana-data:
